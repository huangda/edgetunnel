# Cloudflare Worker 配置（由 GitHub Actions 自动部署）
# 上游源码：https://github.com/cmliu/edgetunnel

name = "hhhh"

# 入口文件由工作流从上游 cmliu/edgetunnel 最新 main 分支拉取后覆盖
main = "_worker.js"

compatibility_date = "2025-11-04"

# 保留 Cloudflare 控制台里手动设置的变量：
# ADMIN（后台密码）只在控制台维护，不写在本文件里，避免密码进入公开仓库
keep_vars = true

# 保留 *.workers.dev 备用域名（国内 DNS 被投毒，基本不可用）
workers_dev = true

# 自定义域名（Workers Custom Domain，DNS 记录由 Cloudflare 自动维护）
# edt.hd1995.uno 主用：国内可直连；dada2006.ccwu.cc 备用：国内直连会被拦
routes = [
	{ pattern = "edt.hd1995.uno", custom_domain = true },
	{ pattern = "dada2006.ccwu.cc", custom_domain = true }
]

[vars]
# 节点里的 host / sni 固定用这个域名，必须和主用自定义域一致
HOST = "edt.hd1995.uno"

[[kv_namespaces]]
binding = "KV"
id = "b6f9573a44ea4a80bb7f0defdb7829db"
